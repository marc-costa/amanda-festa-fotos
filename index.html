<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural da Festa</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
  <div class="max-w-4xl mx-auto text-center space-y-6">
    <h1 class="text-3xl font-bold">Mural de Fotos da Festa 🎉</h1>
    <p class="text-slate-400">Escaneie o QR Code e envie sua foto!</p>
    
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md mx-auto">
      <input type="file" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-pink-500/10 file:text-pink-400">
      <button class="mt-4 w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-2 rounded-xl transition">Enviar Foto</button>
    </div>
  </div>
</body>
