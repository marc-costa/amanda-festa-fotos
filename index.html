<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural de Fotos da Festa 🎉</title>
  <!-- Tailwind CSS para estilização moderna -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- Cabeçalho -->
    <header class="text-center space-y-2">
      <span class="px-3 py-1 text-xs font-semibold bg-pink-500/10 text-pink-400 rounded-full border border-pink-500/20">
        Aniversário da Filha da Amanda 🎈
      </span>
      <h1 class="text-3xl md:text-5xl font-bold tracking-tight">Mural de Fotos ao Vivo</h1>
      <p class="text-slate-400 text-sm">Escaneie o QR Code e compartilhe seus cliques com a gente!</p>
    </header>

    <!-- Formulário de Envio -->
    <section class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl max-w-md mx-auto">
      <h2 class="text-lg font-semibold mb-4 text-center">Enviar nova foto 📸</h2>
      <form id="uploadForm" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Seu Nome ou da Família</label>
          <input 
            type="text" 
            id="uploaderName" 
            placeholder="Ex: Família Silva" 
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500 text-slate-100"
          />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Escolher Imagem</label>
          <input 
            type="file" 
            id="fileInput" 
            accept="image/*" 
            required
            class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-pink-500/10 file:text-pink-400 hover:file:bg-pink-500/20 cursor-pointer"
          />
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-pink-600/20 cursor-pointer"
        >
          Enviar para o Mural 🚀
        </button>
      </form>
    </section>

    <!-- Mural / Álbum de Fotos -->
    <section class="space-y-4">
      <h2 class="text-2xl font-bold border-b border-slate-800 pb-3">Álbum em Tempo Real</h2>
      <div id="photoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        <!-- As fotos carregam aqui dinamicamente -->
        <div class="text-center py-16 text-slate-500 col-span-full bg-slate-900/50 border border-slate-800/50 rounded-3xl">
          Carregando fotos... ✨
        </div>
      </div>
    </section>

  </div>

  <script>
    // Credenciais do seu novo Supabase isolado
    const SUPABASE_URL = 'https://dnsbrwmnjkkmqbhihsfi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuc2Jyd21uamtrbXFiaGloc2ZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNjk0MjQsImV4cCI6MjEwODc0NTQyNH0.Fz6aTnkvFxcApzJsEstEBup_czaipKeMNfbJdekliLE';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const uploaderNameInput = document.getElementById('uploaderName');
    const submitBtn = document.getElementById('submitBtn');
    const photoGrid = document.getElementById('photoGrid');

    // Buscar fotos ao carregar a página
    async function fetchPhotos() {
      const { data, error } = await supabaseClient
        .from('party_photos')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Erro ao buscar fotos:', error);
        return;
      }

      renderPhotos(data);
    }

    // Renderizar grid de fotos
    function renderPhotos(photos) {
      if (!photos || photos.length === 0) {
        photoGrid.innerHTML = `
          <div class="text-center py-16 text-slate-500 col-span-full bg-slate-900/50 border border-slate-800/50 rounded-3xl">
            Ainda nenhuma foto enviada. Seja o primeiro a mandar! ✨
          </div>
        `;
        return;
      }

      photoGrid.innerHTML = photos.map(photo => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl hover:border-slate-700 transition duration-300 group">
          <div class="aspect-square bg-slate-950 relative overflow-hidden">
            <img src="${photo.image_url}" alt="Foto da festa" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy" />
          </div>
          <div class="p-4 flex items-center justify-between text-sm">
            <span class="font-medium text-slate-200 truncate">Por: ${photo.uploader_name || 'Anônimo'}</span>
            <span class="text-xs text-slate-500">${new Date(photo.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
          </div>
        </div>
      `).join('');
    }

    // Envio de foto
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando... 🚀';

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36.substring(2))}.${fileExt}`;
        
        // 1. Upload para o Storage do projeto isolado
        const { error: uploadError } = await supabaseClient.storage
          .from('party-photos')
          .upload(fileName, file);

        if (uploadError) throw uploadError;

        // 2. Pegar URL pública
        const { data: publicUrlData } = supabaseClient.storage
          .from('party-photos')
          .getPublicUrl(fileName);

        // 3. Salvar metadados na tabela
        const { error: dbError } = await supabaseClient
          .from('party_photos')
          .insert([{ 
            image_url: publicUrlData.publicUrl, 
            uploader_name: uploaderNameInput.value.trim() || 'Convidado Anônimo' 
          }]);

        if (dbError) throw dbError;

        alert('Foto enviada com sucesso! 🎉');
        form.reset();
        fetchPhotos();
      } catch (err) {
        console.error(err);
        alert('Erro ao enviar a foto. Tente novamente.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar para o Mural 🚀';
      }
    });

    // Escutar novas fotos em tempo real
    supabaseClient
      .channel('public:party_photos')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'party_photos' }, payload => {
        fetchPhotos(); // Atualiza o mural instantaneamente quando alguém envia
      })
      .subscribe();

    // Inicializar
    fetchPhotos();
  </script>
</body>
</html>
