<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alice faz 5 anos 👑💜 - Mural da Festa</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts: Conto de Fadas -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-fairy { font-family: 'Cinzel', serif; }
  </style>
</head>
<body class="bg-gradient-to-b from-purple-950 via-slate-950 to-slate-950 text-slate-100 min-h-screen p-4 md:p-8">
  
  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- Cabeçalho Temático Rapunzel -->
    <header class="text-center space-y-4 pt-4">
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-400/10 border border-amber-400/30 text-amber-300 text-xs font-semibold tracking-wider uppercase shadow-lg shadow-amber-500/5">
        ✨ Aniversário de Contos de Fadas ✨
      </div>
      
      <h1 class="font-fairy text-4xl md:text-6xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-300 via-pink-300 to-amber-200 drop-shadow-md">
        Alice faz 5 anos 💜👑
      </h1>
      <p class="text-purple-200/80 text-sm md:text-base max-w-lg mx-auto">
        Bem-vindos ao reino! Tire fotos durante a festa e compartilhe suas memórias mágicas no mural ao vivo. 🏮
      </p>

      <!-- Foto da Aniversariante em Destaque -->
      <div class="pt-2 flex justify-center">
        <div class="relative group p-1.5 rounded-3xl bg-gradient-to-tr from-amber-500 via-purple-500 to-pink-500 shadow-2xl shadow-purple-900/50 max-w-xs mx-auto transform hover:scale-[1.02] transition duration-300">
          <div class="rounded-[22px] overflow-hidden bg-slate-900 aspect-[4/5] relative flex items-center justify-center">
            <!-- Imagem da Alice (certifique-se de salvar o arquivo como alice.jpg na pasta ou ajustar o nome) -->
            <img 
              src="alice.jpg" 
              alt="Alice faz 5 anos" 
              class="w-full h-full object-cover"
              onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1519689680058-324335c77eba?q=80&w=800&auto=format&fit=crop';"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-purple-950/80 via-transparent to-transparent flex items-end p-4">
              <span class="text-white font-fairy text-sm font-bold tracking-wide drop-shadow">Princesa Alice 🌸</span>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Formulário de Envio de Fotos -->
    <section class="bg-purple-900/20 backdrop-blur-md border border-purple-500/30 p-6 rounded-3xl shadow-xl max-w-md mx-auto">
      <h2 class="font-fairy text-lg font-semibold mb-4 text-center text-amber-200">Adicionar Foto ao Reino 📸</h2>
      <form id="uploadForm" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-purple-200/70 mb-1">Seu Nome ou da Família</label>
          <input 
            type="text" 
            id="uploaderName" 
            placeholder="Ex: Família Real / Ttia Ju" 
            class="w-full bg-slate-950/80 border border-purple-500/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-400 text-slate-100 placeholder-slate-500"
          />
        </div>

        <div>
          <label class="block text-xs font-medium text-purple-200/70 mb-1">Escolher Imagem da Festa</label>
          <input 
            type="file" 
            id="fileInput" 
            accept="image/*" 
            required
            class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-purple-600/30 file:text-purple-200 hover:file:bg-purple-600/50 cursor-pointer"
          />
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-purple-600/30 cursor-pointer"
        >
          Enviar para o Mural 🌟
        </button>
      </form>
    </section>

    <!-- Mural / Álbum de Fotos em Tempo Real -->
    <section class="space-y-4 pt-4">
      <div class="flex items-center justify-between border-b border-purple-900/50 pb-3">
        <h2 class="font-fairy text-2xl font-bold text-amber-200">Álbum Mágico</h2>
        <span class="text-xs text-purple-300/60 bg-purple-950 px-3 py-1 rounded-full border border-purple-900">Atualização instantânea ⚡</span>
      </div>
      
      <div id="photoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        <div class="text-center py-16 text-purple-300/50 col-span-full bg-purple-950/30 border border-purple-900/40 rounded-3xl">
          Carregando a magia do reino... ✨
        </div>
      </div>
    </section>

  </div>

  <script>
    const SUPABASE_URL = 'https://dnsbrwmnjkkmqbhihsfi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuc2Jyd21uamtrbXFiaGloc2ZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNjk0MjQsImV4cCI6MjEwODc0NTQyNH0.Fz6aTnkvFxcApzJsEstEBup_czaipKeMNfbJdekliLE';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const uploaderNameInput = document.getElementById('uploaderName');
    const submitBtn = document.getElementById('submitBtn');
    const photoGrid = document.getElementById('photoGrid');

    async function fetchPhotos() {
      const { data, error } = await supabaseClient
        .from('party_photos')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Erro ao buscar fotos:', error);
        return;
      }

      renderPhotos(data);
    }

    function renderPhotos(photos) {
      if (!photos || photos.length === 0) {
        photoGrid.innerHTML = `
          <div class="text-center py-16 text-purple-300/50 col-span-full bg-purple-950/30 border border-purple-900/40 rounded-3xl">
            Ainda nenhuma foto enviada. Seja o primeiro a iluminar o reino! 🏮✨
          </div>
        `;
        return;
      }

      photoGrid.innerHTML = photos.map(photo => `
        <div class="bg-purple-950/40 border border-purple-500/20 rounded-2xl overflow-hidden shadow-xl hover:border-amber-400/50 transition duration-300 group">
          <div class="aspect-square bg-slate-950 relative overflow-hidden">
            <img src="${photo.image_url}" alt="Foto da festa da Alice" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy" />
          </div>
          <div class="p-4 flex items-center justify-between text-sm">
            <span class="font-medium text-purple-100 truncate">Por: ${photo.uploader_name || 'Convidado Mágico'}</span>
            <span class="text-xs text-purple-400">${new Date(photo.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
          </div>
        </div>
      `).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando magia... 🌟';

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
        
        const { error: uploadError } = await supabaseClient.storage
          .from('party-photos')
          .upload(fileName, file);

        if (uploadError) throw uploadError;

        const { data: publicUrlData } = supabaseClient.storage
          .from('party-photos')
          .getPublicUrl(fileName);

        const { error: dbError } = await supabaseClient
          .from('party_photos')
          .insert([{ 
            image_url: publicUrlData.publicUrl, 
            uploader_name: uploaderNameInput.value.trim() || 'Convidado Mágico' 
          }]);

        if (dbError) throw dbError;

        alert('Foto enviada para o reino com sucesso! 🎉💜');
        form.reset();
        fetchPhotos();
      } catch (err) {
        console.error(err);
        alert('Erro ao enviar a foto. Tente novamente.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar para o Mural 🌟';
      }
    });

    supabaseClient
      .channel('public:party_photos')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'party_photos' }, payload => {
        fetchPhotos();
      })
      .subscribe();

    fetchPhotos();
  </script>
</body>
</html>
